protocol_id: go2_paper_protocol_v2
command_convention: normalized_body_frame_x_y_yaw

# Frozen after the excluded seed-1 v1 pilot. The pilot showed under-tracking at
# yaw=0.5 rad/s and large action/body-rate variation while dwelling at zero
# between paired directions. V2 uses commands farther from the low-speed regime
# and a continuous sign reversal. Baseline and post-stop windows are retained.
segments:
  paper_v2_stand_08:
    boundary_mode: operator_deadman
    phases:
      - {name: stand, duration_s: 8.0, command: [0.0, 0.0, 0.0]}

  paper_v2_fore_aft_050:
    boundary_mode: operator_deadman
    phases:
      - {name: baseline, duration_s: 2.0, command: [0.0, 0.0, 0.0]}
      - {name: forward_ramp, duration_s: 0.5, command_to: [0.50, 0.0, 0.0]}
      - {name: forward_hold, duration_s: 1.0, command: [0.50, 0.0, 0.0]}
      - {name: reversal, duration_s: 1.0, command_to: [-0.50, 0.0, 0.0]}
      - {name: backward_hold, duration_s: 1.0, command: [-0.50, 0.0, 0.0]}
      - {name: backward_stop, duration_s: 0.5, command_to: [0.0, 0.0, 0.0]}
      - {name: post_stop, duration_s: 2.0, command: [0.0, 0.0, 0.0]}

  paper_v2_lateral_pair_050:
    boundary_mode: operator_deadman
    phases:
      - {name: baseline, duration_s: 2.0, command: [0.0, 0.0, 0.0]}
      - {name: left_ramp, duration_s: 0.5, command_to: [0.0, 0.50, 0.0]}
      - {name: left_hold, duration_s: 1.0, command: [0.0, 0.50, 0.0]}
      - {name: reversal, duration_s: 1.0, command_to: [0.0, -0.50, 0.0]}
      - {name: right_hold, duration_s: 1.0, command: [0.0, -0.50, 0.0]}
      - {name: right_stop, duration_s: 0.5, command_to: [0.0, 0.0, 0.0]}
      - {name: post_stop, duration_s: 2.0, command: [0.0, 0.0, 0.0]}

  paper_v2_yaw_pair_080:
    boundary_mode: operator_deadman
    phases:
      - {name: baseline, duration_s: 2.0, command: [0.0, 0.0, 0.0]}
      - {name: ccw_ramp, duration_s: 0.5, command_to: [0.0, 0.0, 0.80]}
      - {name: ccw_hold, duration_s: 1.0, command: [0.0, 0.0, 0.80]}
      - {name: reversal, duration_s: 1.0, command_to: [0.0, 0.0, -0.80]}
      - {name: cw_hold, duration_s: 1.0, command: [0.0, 0.0, -0.80]}
      - {name: cw_stop, duration_s: 0.5, command_to: [0.0, 0.0, 0.0]}
      - {name: post_stop, duration_s: 2.0, command: [0.0, 0.0, 0.0]}
